name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# No secrets. Fork pull requests cannot reach Telegram or the cloud accounts.
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Unit tests
        run: pytest
      - name: Compile
        run: python -m compileall -q backup scripts
