name: Nightshift

on:
  schedule:
    # 02:30 Asia/Kuala_Lumpur (UTC+8, no daylight saving) is 18:30 UTC.
    # GitHub starts scheduled jobs when capacity allows, so the run can slip.
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only. Discover videos but do not download or upload."
        type: boolean
        default: false
      daily_limit:
        description: "Videos to attempt tonight (1-5). Higher numbers are clamped to 5."
        type: string
        default: "5"
      force_unlock:
        description: "Take over a ledger lock left behind by a killed run."
        type: boolean
        default: false

# A second night must not start while the first still holds the runner.
concurrency:
  group: nightshift-backup
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Check out the ledger
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Git identity for ledger commits
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Back up tonight's videos
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GDRIVE_ACCOUNTS_JSON: ${{ secrets.GDRIVE_ACCOUNTS_JSON }}
          MEGA_ACCOUNTS_JSON: ${{ secrets.MEGA_ACCOUNTS_JSON }}
          DAILY_LIMIT: ${{ github.event.inputs.daily_limit || '5' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
          FORCE_UNLOCK: ${{ github.event.inputs.force_unlock == 'true' && 'true' || 'false' }}
          NIGHTSHIFT_GIT_COMMIT: "1"
          BACKUP_DB_PATH: data/backup_db.json
          DOWNLOAD_DIR: /tmp/nightshift-downloads
          LOG_PATH: logs/nightshift.jsonl
        run: python -m backup

      - name: Upload the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightshift-log-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 14
